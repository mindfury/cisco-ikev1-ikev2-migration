! ============================================================
! ISR2911-LAB Synthetic IKEv1 Test Config
! Mirrors ISR4431 production scenario (sanitized)
! Weak algorithms intentionally present for FN72510 testing
! Paste after bootstrap config is running
! ============================================================
conf t
!
! --- IKEv1 Phase 1: weak algorithms (FN72510 targets) ---
crypto isakmp policy 10
 encr 3des
 hash md5
 authentication pre-share
 group 2
 lifetime 86400
!
! --- Pre-shared keys (documentation IPs per RFC 5737) ---
crypto isakmp key TestPSK-Tunnel1 address 192.0.2.1
crypto isakmp key TestPSK-Tunnel2 address 192.0.2.2
!
! --- Phase 2: weak transform-set ---
crypto ipsec transform-set TS-AWS-WEAK esp-3des esp-md5-hmac
 mode tunnel
!
! --- ACLs defining interesting traffic ---
ip access-list extended ACL-VPN-TUNNEL1
 permit ip 10.0.1.0 0.0.0.255 172.16.0.0 0.0.0.255
!
ip access-list extended ACL-VPN-TUNNEL2
 permit ip 10.0.1.0 0.0.0.255 172.16.1.0 0.0.0.255
!
! --- Crypto map: two tunnel entries, same weak transform-set ---
crypto map CMAP-AWS 10 ipsec-isakmp
 set peer 192.0.2.1
 set transform-set TS-AWS-WEAK
 set pfs group2
 match address ACL-VPN-TUNNEL1
!
crypto map CMAP-AWS 20 ipsec-isakmp
 set peer 192.0.2.2
 set transform-set TS-AWS-WEAK
 set pfs group2
 match address ACL-VPN-TUNNEL2
!
end
write memory
