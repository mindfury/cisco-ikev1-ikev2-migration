! ISR 2911 — IKEv1 VTI + BGP pre-migration test fixture (sanitised)
! Peer IPs and PSKs are from the AWS lab at time of testing.
! group 2 PFS in ipsec profile is the FN72510 target.
!
version 15.7
!
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 28800
crypto isakmp key LabPSKTunnel1 address 192.0.2.1
crypto isakmp key LabPSKTunnel2 address 192.0.2.2
!
crypto ipsec transform-set TS-AWS-VTI esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile AWS-VTI-PROFILE
 set transform-set TS-AWS-VTI
 set pfs group2
!
interface Loopback0
 ip address 10.0.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Lab LAN
 ip address dhcp
 duplex auto
 speed auto
!
interface Tunnel1
 ip address 169.254.10.2 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel mode ipsec ipv4
 tunnel destination 192.0.2.1
 tunnel protection ipsec profile AWS-VTI-PROFILE
!
interface Tunnel2
 ip address 169.254.11.2 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel mode ipsec ipv4
 tunnel destination 192.0.2.2
 tunnel protection ipsec profile AWS-VTI-PROFILE
!
router bgp 65000
 bgp log-neighbor-changes
 neighbor 169.254.10.1 remote-as 64512
 neighbor 169.254.10.1 timers 10 30 30
 neighbor 169.254.11.1 remote-as 64512
 neighbor 169.254.11.1 timers 10 30 30
 !
 address-family ipv4
  network 10.0.1.0 mask 255.255.255.0
  neighbor 169.254.10.1 activate
  neighbor 169.254.10.1 soft-reconfiguration inbound
  neighbor 169.254.11.1 activate
  neighbor 169.254.11.1 soft-reconfiguration inbound
 exit-address-family
!
ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/0 dhcp
!
end
