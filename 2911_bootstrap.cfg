! ============================================================
! ISR2911-LAB Bootstrap Config
! Paste via console to bring up SSH access
! ============================================================
enable
conf t
hostname ISR2911-LAB
no ip domain-lookup
ip domain-name lab.local
!
username admin privilege 15 secret Lab12345!
!
crypto key generate rsa modulus 2048
!
interface GigabitEthernet0/0
 description Home LAN
 ip address dhcp
 no shutdown
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line vty 0 4
 login local
 transport input ssh
!
line con 0
 login local
!
end
write memory
